# Windows edition: build and check the helper (zig cc), mke2fs.exe and both programs (PyInstaller) - helper on
# image files, built-in ELF and version, start the programs. When a release is published, the build uses its
# usb_format.elf and both .exe files are attached to the release (otherwise the ELF of the latest release).
name: Windows

on:
  push:
    branches: [main]
  pull_request:   # e.g. Dependabot proposals: build and check, publish nothing
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # as in development - the programs are tested with it

      - name: Python packages
        run: python -m pip install -r windows/requirements-build.txt

      - name: Payload from this (or the latest) release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern usb_format.elf --dir usb_format

      - name: Build helper and mke2fs.exe
        working-directory: windows
        run: ./build_helper.ps1 -Test

      - name: Helper on image files
        run: ./windows/tests/win_helper_test.ps1

      - name: Check update notice and image (without admin rights)
        run: python windows/tests/pc_tools_test.py windows/usbfmt_win_test.exe

      - name: App logic (versions, duplicates, pre-check, package notes)
        run: python windows/tests/app_logic_test.py

      - name: App layout in all languages (nothing cut off, nothing past the edge)
        timeout-minutes: 8
        run: python windows/tests/gui_layout_test.py

      - name: Check the interface with an open list (focus trap, messages, copy dialog)
        timeout-minutes: 3
        run: python windows/tests/gui_robust_test.py

      - name: Build programs
        working-directory: windows
        shell: cmd
        run: build_exe.bat

      - name: Self-test of the built programs (translations, helper checksum, ELF, all tabs)
        working-directory: windows
        run: |
          foreach ($a in "PS5-USB-Formatierer", "USB-Formatierer") {
              $f = Join-Path $env:RUNNER_TEMP "selftest-$a.txt"
              $p = Start-Process -PassThru -Wait "dist\$a.exe" -ArgumentList "--selftest", $f
              if (Test-Path $f) { Get-Content $f } else { Write-Host "${a}: keine Ausgabe" }
              if ($p.ExitCode -ne 0) { Write-Host "${a}: Selbsttest fehlgeschlagen (Exit $($p.ExitCode))"; exit 1 }
          }

      - name: Check and start the programs
        working-directory: windows
        run: |
          python tests/elf_in_program.py dist/PS5-USB-Formatierer.exe ../usb_format/usb_format.elf (Get-Content ../VERSION).Trim()
          if ($LASTEXITCODE) { exit 1 }
          foreach ($a in "PS5-USB-Formatierer", "USB-Formatierer") {
              $p = Start-Process -PassThru "dist\$a.exe"
              Start-Sleep 12
              if ($p.HasExited) { Write-Host "$a crashed"; exit 1 }
              Get-Process -Name $a -ErrorAction SilentlyContinue | Stop-Process -Force
              Write-Host "$a is running"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-programs
          path: windows/dist/*.exe

  # only when publishing: attach the checked programs to the release
  release:
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-programs
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
