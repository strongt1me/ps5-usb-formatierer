# Windows-Fassung: Helfer (zig cc), mke2fs.exe und beide Programme (PyInstaller) bauen und prüfen - Helfer an
# Abbild-Dateien, eingebaute ELF und Version, Programme starten. Beim Veröffentlichen eines Releases wird mit dessen
# usb_format.elf gebaut und beide .exe werden an das Release gehängt (sonst mit der ELF des letzten Releases).
name: Windows

on:
  push:
    branches: [main]
  pull_request:   # z. B. Dependabot-Vorschläge: bauen und prüfen, nichts veröffentlichen
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # wie bei der Entwicklung - die Programme sind damit getestet

      - name: Python-Pakete
        run: python -m pip install -r windows/requirements-build.txt

      - name: Payload aus diesem (bzw. dem letzten) Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern usb_format.elf --dir usb_format

      - name: Helfer und mke2fs.exe bauen
        working-directory: windows
        run: ./build_helper.ps1 -Test

      - name: Helfer an Abbild-Dateien
        run: ./windows/tests/win_helper_test.ps1

      - name: Update-Hinweis und Image prüfen (ohne Administratorrechte)
        run: python windows/tests/pc_tools_test.py windows/usbfmt_win_test.exe

      - name: Logik der App (Versionen, Duplikate, Vorabprüfung, Paket-Hinweise)
        run: python windows/tests/app_logic_test.py

      - name: Layout der App in allen Sprachen (nichts abgeschnitten, nichts über den Rand)
        timeout-minutes: 8
        run: python windows/tests/gui_layout_test.py

      - name: Oberfläche bei aufgeklappter Liste prüfen (Fokusfang, Meldungen, Kopierdialog)
        timeout-minutes: 3
        run: python windows/tests/gui_robust_test.py

      - name: Programme bauen
        working-directory: windows
        shell: cmd
        run: build_exe.bat

      - name: Selbsttest der gebauten Programme (Übersetzungen, Helfer-Prüfsumme, ELF, alle Reiter)
        working-directory: windows
        run: |
          foreach ($a in "PS5-USB-Formatierer", "USB-Formatierer") {
              $f = Join-Path $env:RUNNER_TEMP "selftest-$a.txt"
              $p = Start-Process -PassThru -Wait "dist\$a.exe" -ArgumentList "--selftest", $f
              if (Test-Path $f) { Get-Content $f } else { Write-Host "${a}: keine Ausgabe" }
              if ($p.ExitCode -ne 0) { Write-Host "${a}: Selbsttest fehlgeschlagen (Exit $($p.ExitCode))"; exit 1 }
          }

      - name: Programme prüfen und starten
        working-directory: windows
        run: |
          python tests/elf_in_program.py dist/PS5-USB-Formatierer.exe ../usb_format/usb_format.elf (Get-Content ../VERSION).Trim()
          if ($LASTEXITCODE) { exit 1 }
          foreach ($a in "PS5-USB-Formatierer", "USB-Formatierer") {
              $p = Start-Process -PassThru "dist\$a.exe"
              Start-Sleep 12
              if ($p.HasExited) { Write-Host "$a ist abgestürzt"; exit 1 }
              Get-Process -Name $a -ErrorAction SilentlyContinue | Stop-Process -Force
              Write-Host "$a läuft"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-programme
          path: windows/dist/*.exe

  # nur beim Veröffentlichen: die geprüften Programme an das Release hängen
  release:
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-programme
          path: dist

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
