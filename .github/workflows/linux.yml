# Linux-Fassung: Helfer bauen und testen (auch als root an echten Loop-Geräten), Oberfläche unter Xvfb prüfen,
# beide Programme mit PyInstaller bauen - als .tar.gz und als AppImage, für x86_64 und aarch64 (ARM64, z. B. Raspberry
# Pi). Gebaut wird auf Ubuntu 22.04 (glibc 2.35), damit die Programme auch auf älteren Verteilungen laufen; der Helfer
# ist statisch. Python wie bei der Entwicklung (3.14). Daneben die Host-Tests des PS5-Codes (eigener Job).
# Beim Veröffentlichen eines Releases: mit dessen usb_format.elf bauen und die Dateien an das Release hängen. Von Hand
# (workflow_dispatch mit tag) dasselbe für ein schon veröffentlichtes Release, etwa nach einem behobenen Testfehler.
name: Linux

on:
  push:
    branches: [main, "linux*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release, an das die Archive gehängt werden (z. B. v2.5.11); leer = nur bauen und prüfen"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-22.04-arm
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dosfstools exfatprogs ntfs-3g hfsprogs util-linux xvfb tk-dev \
            libtk8.6 python3-tk zstd
          for t in mke2fs mkfs.fat mkntfs fsck.exfat fsck.hfsplus e2fsck sfdisk; do command -v $t || echo "fehlt: $t"; done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Python-Pakete
        run: python -m pip install -r windows/requirements-build.txt

      - name: Übersetzungen und Code prüfen
        run: |
          python usb_format/tools/i18n_gen.py
          git diff --exit-code usb_format/src/i18n_table.c
          python usb_format/tools/web_i18n.py --check
          python windows/i18n_check.py
          v=$(cat VERSION); for f in README*.md; do grep -q "badge/[^-]*-$v-" "$f" || { echo "$f: Version $v fehlt"; exit 1; }; done
          cd windows && python -m pyflakes usb_formatierer.py usb_standard.py standard_panel.py partition_editor.py \
            pc_common.py pc_linux.py fsinfo.py i18n.py ps5_discovery.py ui_theme.py ui_widgets.py ui_msgbox.py \
            tests/linux_ui_test.py tests/ps5_image_flow_test.py tests/pc_tools_test.py
          cd .. && python -m pyflakes tools/release.py tools/ps5_deploy.py && python tools/ps5_deploy.py --help >/dev/null

      - name: Helfer bauen
        working-directory: usb_format
        run: |
          bash src/linux/build.sh /tmp/usbfmt_linux_test -DUSBFMT_TEST
          bash src/linux/build.sh /tmp/usbfmt_linux
          file /tmp/usbfmt_linux

      - name: Helfer an Abbild-Dateien
        working-directory: usb_format
        run: bash test/linux_helper_test.sh

      - name: Helfer an Loop-Geräten (root)
        working-directory: usb_format
        run: sudo -E env "PATH=$PATH" bash test/linux_loop_test.sh

      - name: Update-Hinweis und Image prüfen (ohne Root)
        run: xvfb-run -a python windows/tests/pc_tools_test.py /tmp/usbfmt_linux_test

      - name: Oberfläche (Xvfb)
        timeout-minutes: 20   # ein unerwarteter Dialog hielte den Test sonst bis zur 6-Stunden-Grenze an
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1600x1200x24" python windows/tests/linux_ui_test.py /tmp/usbfmt_linux_test shots

      - name: Payload aus diesem (bzw. dem letzten) Release (für die PS5-Fassung)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          command -v gh >/dev/null || sudo apt-get install -y gh   # falls das ARM-Abbild es nicht mitbringt
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern usb_format.elf --dir /tmp/elf

      - name: AppImage-Werkzeug (feste Fassung, Prüfsumme)
        run: |
          mkdir -p /tmp/appimage && cd /tmp/appimage
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSLo runtime "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          echo "${{ matrix.appimagetool_sha256 }}  appimagetool" | sha256sum -c
          echo "${{ matrix.runtime_sha256 }}  runtime" | sha256sum -c
          chmod +x appimagetool

      - name: Programme bauen
        env:
          APPIMAGETOOL: /tmp/appimage/appimagetool
          APPIMAGE_RUNTIME: /tmp/appimage/runtime
        run: bash windows/build_linux.sh /tmp/elf/usb_format.elf

      - name: Eingebaute ELF und Version prüfen, AppImage enthält dasselbe Programm
        run: |
          python windows/tests/elf_in_program.py windows/dist/PS5-USB-Formatierer /tmp/elf/usb_format.elf "$(cat VERSION)"
          for app in PS5-USB-Formatierer USB-Formatierer; do
            rm -rf /tmp/x && mkdir /tmp/x && cd /tmp/x
            APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/windows/dist/$app-${{ matrix.arch }}.AppImage" --appimage-extract >/dev/null
            cmp squashfs-root/usr/bin/$app "$GITHUB_WORKSPACE/windows/dist/$app" || { echo "$app.AppImage weicht ab"; exit 1; }
            echo "$app.AppImage: Programm identisch"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Gebaute Programme starten (Xvfb, ohne Datenträger)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # Läufer ohne FUSE
          USBFMT_NO_UPDATE_CHECK: 1
        run: |
          for prog in PS5-USB-Formatierer USB-Formatierer PS5-USB-Formatierer-${{ matrix.arch }}.AppImage \
                      USB-Formatierer-${{ matrix.arch }}.AppImage; do
            timeout 20 xvfb-run -a "windows/dist/$prog" & pid=$!
            sleep 12
            kill -0 $pid && echo "$prog läuft" || { echo "$prog ist abgestürzt"; exit 1; }
            kill $pid 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-programme-${{ matrix.arch }}
          path: |
            windows/dist/*.tar.gz
            windows/dist/*.AppImage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-bilder-${{ matrix.arch }}
          path: shots/

  # nur beim Veröffentlichen: die geprüften Archive und AppImages beider Architekturen an das Release hängen
  release:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-programme-*
          merge-multiple: true
          path: dist

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/*.tar.gz dist/*.AppImage --clobber --repo "$GITHUB_REPOSITORY"

      # von Hand neu angehängt (workflow_dispatch): die Dateien sind neu gebaut, also SHA256SUMS erneuern - beim
      # Veröffentlichen erledigt das checksums.yml
      - name: Prüfsummen erneuern
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -q '.assets[] | select(.name != "SHA256SUMS") | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k2 >SHA256SUMS
          cat SHA256SUMS
          if grep -qv '^[0-9a-f]\{64\}  [^ /]' SHA256SUMS; then echo "Datei ohne Prüfsumme von GitHub"; exit 1; fi
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Der PS5-Code (Payload) als Host-Programm - FreeBSD hat arc4random, glibc erst ab 2.36: daher Ubuntu 24.04
  payload:
    if: github.event_name != 'release'   # beim Release schon beim Push des Tags geprüft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dosfstools exfatprogs ntfs-3g hfsprogs mtools makefs gdisk zstd \
            xvfb python3-tk

      - name: Image-Sicherung mit dem zstd-Programm entpackbar?
        working-directory: usb_format
        run: zstd --version && bash test/imgbak_test.sh | tee /tmp/ib.log | grep -E "zstd|bestanden|FEHLER" && ! grep -q FEHLER /tmp/ib.log

      - name: PC-Programm "An der PS5" - Image-Sicherung gegen den Testserver (Xvfb)
        working-directory: usb_format
        run: bash test/pc_flow_test.sh

      - name: Weboberfläche - Update-Hinweis und Verlauf (node, Code aus web/index.html)
        working-directory: usb_format
        run: node --version && node test/web_logic_test.js web/index.html

      - name: Payload-Tests (Host)
        working-directory: usb_format
        run: |
          fails=0
          for t in test/run_tests.sh test/extfs_test.sh test/mounted_test.sh test/format_settings_test.sh \
                   test/open_test.sh test/layout_test.sh test/devtest_test.sh test/library_test.sh test/fsck_test.sh \
                   test/features_test.sh test/delete_test.sh test/concurrency_test.sh test/parts_test.sh \
                   test/imgbak_test.sh test/backup_test.sh test/sha_test.sh test/tile_test.sh test/history_test.sh; do
            echo "== $t"
            bash "$t" >/tmp/t.log 2>&1 && tail -n 1 /tmp/t.log || { cat /tmp/t.log; fails=$((fails + 1)); }
          done
          exit $fails
