# Linux edition: build and test the helper (also as root on real loop devices), check the interface under Xvfb,
# build both programs with PyInstaller - as .tar.gz and as AppImage, for x86_64 and aarch64 (ARM64, e.g. Raspberry
# Pi). Builds run in an Ubuntu 22.04 container (glibc 2.35) so the programs also run on older distributions -
# GitHub is retiring the 22.04 runners themselves (brownouts since Sept. 2026, gone from April 2027). The helper is
# static; its test on real loop devices (root) is a separate job directly on the runner, because no partition
# devices (/dev/loopNpM) appear inside the container. Python as in development (3.14). Plus the host tests of the PS5 code (own job).
# When a release is published: build with its usb_format.elf and attach the files to the release. Manually
# (workflow_dispatch with tag) the same for an already published release, e.g. after a fixed test failure.
name: Linux

on:
  push:
    branches: [main, "linux*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release the archives are attached to (e.g. v2.5.11); empty = only build and test"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-24.04-arm
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # own, empty tool cache: the runner's contains Python for 24.04 (glibc 2.38) - this way setup-python loads
      # the build for 22.04
      RUNNER_TOOL_CACHE: /opt/toolcache
      AGENT_TOOLSDIRECTORY: /opt/toolcache
    steps:
      # the bare image has almost nothing the runners otherwise preinstall (git before checkout: otherwise the
      # working folder is not a repository and the translation table check via git diff fails)
      - name: Tools
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates file xz-utils gcc libc6-dev binutils gh xvfb xauth \
            fonts-dejavu-core e2fsprogs dosfstools exfatprogs ntfs-3g hfsprogs util-linux fdisk tk-dev libtk8.6 python3-tk zstd
          git config --global --add safe.directory '*'
          for t in mke2fs mkfs.fat mkntfs fsck.exfat fsck.hfsplus e2fsck sfdisk; do command -v $t || echo "fehlt: $t"; done

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Python packages
        run: python -m pip install -r windows/requirements-build.txt

      - name: Check translations and code
        run: |
          python usb_format/tools/i18n_gen.py
          git diff --exit-code usb_format/src/i18n_table.c
          python usb_format/tools/web_i18n.py --check
          python windows/i18n_check.py
          v=$(cat VERSION); for f in README*.md; do grep -q "badge/[^-]*-$v-" "$f" || { echo "$f: Version $v fehlt"; exit 1; }; done
          cd windows && python -m pyflakes usb_formatierer.py usb_standard.py standard_panel.py partition_editor.py \
            pc_common.py pc_linux.py fsinfo.py i18n.py ps5_discovery.py ui_theme.py ui_widgets.py ui_msgbox.py \
            tests/linux_ui_test.py tests/ps5_image_flow_test.py tests/pc_tools_test.py zsync_update.py tests/zsync_test.py
          cd .. && python -m pyflakes tools/release.py tools/ps5_deploy.py tools/changelog.py tools/changelog_test.py \
            && python tools/ps5_deploy.py --help >/dev/null

      - name: Changelog (format, both languages, link references)
        run: |
          python tools/changelog.py
          python tools/changelog_test.py

      - name: Build helper
        working-directory: usb_format
        run: |
          bash src/linux/build.sh /tmp/usbfmt_linux_test -DUSBFMT_TEST
          bash src/linux/build.sh /tmp/usbfmt_linux
          file /tmp/usbfmt_linux
          file /tmp/usbfmt_linux | grep -q "statically linked" || { echo "helper is not statically linked (will not run on older systems)"; exit 1; }

      - name: Helper on image files
        working-directory: usb_format
        run: bash test/linux_helper_test.sh

      - name: Check update notice and image (without root)
        run: xvfb-run -a python windows/tests/pc_tools_test.py /tmp/usbfmt_linux_test

      - name: Update AppImage with zsync (changed parts only)
        run: python windows/tests/zsync_test.py

      - name: User interface (Xvfb)
        timeout-minutes: 20   # ein unerwarteter Dialog hielte den Test sonst bis zur 6-Stunden-Grenze an
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1600x1200x24" python windows/tests/linux_ui_test.py /tmp/usbfmt_linux_test shots

      - name: Payload from this (or the latest) release (for the PS5 edition)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern usb_format.elf --dir /tmp/elf

      - name: AppImage tool (pinned version, checksum)
        run: |
          mkdir -p /tmp/appimage && cd /tmp/appimage
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSLo runtime "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          echo "${{ matrix.appimagetool_sha256 }}  appimagetool" | sha256sum -c
          echo "${{ matrix.runtime_sha256 }}  runtime" | sha256sum -c
          chmod +x appimagetool

      - name: Build programs
        env:
          APPIMAGETOOL: /tmp/appimage/appimagetool
          APPIMAGE_RUNTIME: /tmp/appimage/runtime
        run: bash windows/build_linux.sh /tmp/elf/usb_format.elf

      - name: Check built-in ELF and version, AppImage contains the same program
        run: |
          python windows/tests/elf_in_program.py windows/dist/PS5-USB-Formatierer /tmp/elf/usb_format.elf "$(cat VERSION)"
          for app in PS5-USB-Formatierer USB-Formatierer; do
            rm -rf /tmp/x && mkdir /tmp/x && cd /tmp/x
            APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/windows/dist/$app-${{ matrix.arch }}.AppImage" --appimage-extract >/dev/null
            cmp squashfs-root/usr/bin/$app "$GITHUB_WORKSPACE/windows/dist/$app" || { echo "$app.AppImage weicht ab"; exit 1; }
            echo "$app.AppImage: Programm identisch"
            upd="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|$app-${{ matrix.arch }}.AppImage.zsync"
            grep -qaF "$upd" "$GITHUB_WORKSPACE/windows/dist/$app-${{ matrix.arch }}.AppImage" || { echo "$app.AppImage ohne Update-Information"; exit 1; }
            grep -q "^Filename: $app-${{ matrix.arch }}.AppImage$" "$GITHUB_WORKSPACE/windows/dist/$app-${{ matrix.arch }}.AppImage.zsync" || { echo "$app.AppImage.zsync does not match"; exit 1; }
            echo "$app.AppImage: update information and .zsync present"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Self-test of the built programs (translations, ELF, all tabs; Xvfb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          for prog in PS5-USB-Formatierer USB-Formatierer PS5-USB-Formatierer-${{ matrix.arch }}.AppImage \
                      USB-Formatierer-${{ matrix.arch }}.AppImage; do
            timeout 120 xvfb-run -a "windows/dist/$prog" --selftest /tmp/selftest.txt || { cat /tmp/selftest.txt 2>/dev/null; echo "$prog: Selbsttest fehlgeschlagen"; exit 1; }
            echo "== $prog"; cat /tmp/selftest.txt
          done

      - name: Start the built programs (Xvfb, no drive)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # runner without FUSE
          USBFMT_NO_UPDATE_CHECK: 1
        run: |
          for prog in PS5-USB-Formatierer USB-Formatierer PS5-USB-Formatierer-${{ matrix.arch }}.AppImage \
                      USB-Formatierer-${{ matrix.arch }}.AppImage; do
            timeout 20 xvfb-run -a "windows/dist/$prog" & pid=$!
            sleep 12
            kill -0 $pid && echo "$prog is running" || { echo "$prog crashed"; exit 1; }
            kill $pid 2>/dev/null || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-programs-${{ matrix.arch }}
          path: |
            windows/dist/*.tar.gz
            windows/dist/*.AppImage
            windows/dist/*.AppImage.zsync

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-images-${{ matrix.arch }}
          path: shots/

  # helper on real loop devices (root) - directly on the runner, not in the container (see above)
  loop:
    name: loop (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dosfstools exfatprogs ntfs-3g hfsprogs util-linux zstd

      - name: Helper on loop devices (root; the test builds it itself)
        working-directory: usb_format
        run: sudo -E env "PATH=$PATH" bash test/linux_loop_test.sh

  # only when publishing: attach the checked archives and AppImages (with .zsync for AppImageUpdate) of both
  # architectures to the release
  release:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: [linux, loop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-programs-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/*.tar.gz dist/*.AppImage dist/*.AppImage.zsync --clobber --repo "$GITHUB_REPOSITORY"

      # re-attached manually (workflow_dispatch): the files are rebuilt, so renew SHA256SUMS - when
      # publishing, checksums.yml does this
      - name: Renew checksums
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -q '.assets[] | select(.name != "SHA256SUMS") | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k2 >SHA256SUMS
          cat SHA256SUMS
          [ -s SHA256SUMS ] || { echo "no files found - SHA256SUMS stays unchanged"; exit 1; }
          if grep -qv '^[0-9a-f]\{64\}  [^ /]' SHA256SUMS; then echo "file without checksum from GitHub"; exit 1; fi
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Der PS5-Code (Payload) als Host-Programm - FreeBSD hat arc4random, glibc erst ab 2.36: daher Ubuntu 24.04.
  # Second pass with AddressSanitizer and UBSan: the same test series, any memory error makes it fail.
  payload:
    name: payload${{ matrix.san && ' (Sanitizer)' || '' }}
    if: github.event_name != 'release'   # for a release already checked when the tag was pushed
    strategy:
      fail-fast: false
      matrix:
        san: ["", "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs dosfstools exfatprogs ntfs-3g hfsprogs mtools makefs gdisk zstd \
            xvfb python3-tk

      - name: Image backup extractable with the zstd program?
        if: matrix.san == ''
        working-directory: usb_format
        run: |
          set -o pipefail
          zstd --version
          bash test/imgbak_test.sh | tee /tmp/ib.log | grep -E "zstd|bestanden|FEHLER"
          ! grep -q FEHLER /tmp/ib.log

      - name: PC program "On the PS5" - image backup against the test server (Xvfb)
        if: matrix.san == ''
        working-directory: usb_format
        run: bash test/pc_flow_test.sh

      - name: Web interface - update notice and history (node, code from web/index.html)
        if: matrix.san == ''
        working-directory: usb_format
        run: node --version && node test/web_logic_test.js web/index.html

      - name: Web interface in the browser (Playwright, all tabs and dialogs, no JavaScript errors)
        if: matrix.san == ''
        working-directory: usb_format
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
          bash test/host_build.sh /tmp/websrv -DSERVER_PORT=18124
          python3 test/web_smoke_test.py /tmp/websrv

      - name: Payload tests (host)
        working-directory: usb_format
        env:
          HOST_CFLAGS: ${{ matrix.san }}
          # reports go to files: an error in the background server that the test itself does not notice also counts
          ASAN_OPTIONS: log_path=/tmp/san/asan:detect_leaks=0
          UBSAN_OPTIONS: log_path=/tmp/san/ubsan:print_stacktrace=1
        run: |
          mkdir -p /tmp/san
          fails=0
          for t in test/run_tests.sh test/extfs_test.sh test/mounted_test.sh test/format_settings_test.sh \
                   test/open_test.sh test/layout_test.sh test/devtest_test.sh test/library_test.sh test/fsck_test.sh \
                   test/features_test.sh test/delete_test.sh test/concurrency_test.sh test/parts_test.sh \
                   test/imgbak_test.sh test/backup_test.sh test/sha_test.sh test/tile_test.sh test/history_test.sh test/saves_test.sh test/move_test.sh \
                   test/places_test.sh test/pkginfo_test.sh test/precheck_test.sh test/gverify_test.sh test/partials_test.sh test/orphans_test.sh test/manifest_test.sh test/compare_test.sh test/smp_test.sh test/toggle_test.sh test/fsread_fuzz.sh test/api_fuzz.sh; do
            echo "== $t"
            bash "$t" >/tmp/t.log 2>&1 && tail -n 1 /tmp/t.log || { cat /tmp/t.log; fails=$((fails + 1)); }
            if ls /tmp/san/* >/dev/null 2>&1; then cat /tmp/san/*; rm -f /tmp/san/*; fails=$((fails + 1)); fi
          done
          exit $fails
