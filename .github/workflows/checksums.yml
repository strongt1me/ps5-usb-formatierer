# Attach the checksums of all release files as SHA256SUMS to the release - after every successful release run of
# Windows and Linux (they attach their programs; one after the other, the later one sees all files), manually for a tag.
# Die Werte berechnet GitHub selbst beim Hochladen (Feld digest jeder Datei) - nichts wird erneut geladen.
# Verify: sha256sum -c --ignore-missing SHA256SUMS  (Windows: certutil -hashfile <file> SHA256)
name: Checksums

on:
  workflow_run:
    workflows: [Windows, Linux]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release whose checksums are renewed (e.g. v2.6.2)"
        required: true

permissions:
  contents: write

jobs:
  sums:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    # one after the other per release - on the job, not the workflow: otherwise the many skipped runs (push,
    # pull requests) would displace a waiting real run, and SHA256SUMS would miss files
    concurrency:
      group: checksums-${{ inputs.tag || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Create and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -q '.assets[] | select(.name != "SHA256SUMS") | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k2 >SHA256SUMS
          cat SHA256SUMS
          [ -s SHA256SUMS ] || { echo "keine Dateien am Release $TAG"; exit 1; }
          if grep -qv '^[0-9a-f]\{64\}  [^ /]' SHA256SUMS; then echo "file without checksum from GitHub"; exit 1; fi
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
