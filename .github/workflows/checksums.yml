# Prüfsummen aller Release-Dateien als SHA256SUMS an das Release hängen - nach jedem erfolgreichen Release-Lauf von
# Windows und Linux (die hängen ihre Programme an; nacheinander, der spätere sieht alle Dateien), von Hand für ein Tag.
# Die Werte berechnet GitHub selbst beim Hochladen (Feld digest jeder Datei) - nichts wird erneut geladen.
# Prüfen: sha256sum -c --ignore-missing SHA256SUMS  (Windows: certutil -hashfile <Datei> SHA256)
name: Prüfsummen

on:
  workflow_run:
    workflows: [Windows, Linux]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release, dessen Prüfsummen erneuert werden (z. B. v2.6.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: pruefsummen
  cancel-in-progress: false

jobs:
  sums:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS erzeugen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -q '.assets[] | select(.name != "SHA256SUMS") | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k2 >SHA256SUMS
          cat SHA256SUMS
          [ -s SHA256SUMS ] || { echo "keine Dateien am Release $TAG"; exit 1; }
          if grep -qv '^[0-9a-f]\{64\}  [^ /]' SHA256SUMS; then echo "Datei ohne Prüfsumme von GitHub"; exit 1; fi
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
