# Dependabot: once a month proposes new versions of the GitHub Actions and the Python build tools
# (windows/requirements-build.txt) as pull requests - one grouped PR each. The CI (Windows, Linux x86_64/aarch64)
# builds and tests it; merging is manual. Not covered: appimagetool/type2-runtime (pinned version with
# checksum in linux.yml) and the ps5-payload-sdk (local in WSL).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: pip
    directory: "/windows"
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ["*"]
    ignore:
      # 0.17.0 is not on PyPI for Windows (Windows build fails, PR #1/#2) - later versions are fine again
      - dependency-name: ziglang
        versions: ["0.17.0"]
    commit-message:
      prefix: "Build tools"
